[project]
name = "temporal-patching-101"
version = "0.1.0"
description = "Demo of safe and unsafe Temporal workflow patching using an online-marketplace OrderWorkflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["temporalio>=1.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
